name: Setup media tools
description: Static FFmpeg (cached) + libraqm so Pillow shapes Thai text correctly

# apt-installing ffmpeg pulls ~150 packages and has hung for 25+ minutes on
# GitHub's Ubuntu runners, so FFmpeg comes from a static build instead and
# apt only installs the small text-shaping library.
runs:
  using: composite
  steps:
    - name: Cache FFmpeg
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/ffmpeg
        key: ffmpeg-btbn-n8.1-linux64-gpl-v1

    - name: Download static FFmpeg
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/ffmpeg
        curl -fsSL --retry 3 --max-time 300 \
          https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
          | tar -xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'

    - name: Put FFmpeg on PATH
      shell: bash
      run: |
        echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
        "$HOME/ffmpeg/ffmpeg" -hide_banner -version | head -1

    - name: Thai text shaping (libraqm)
      shell: bash
      run: |
        echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
        sudo rm -f /var/lib/man-db/auto-update
        for i in 1 2 3; do
          sudo timeout 180 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            && sudo timeout 180 apt-get install -y --no-install-recommends libraqm0 \
            && exit 0
          echo "apt attempt $i failed; retrying in 15s"; sleep 15
        done
        exit 1
