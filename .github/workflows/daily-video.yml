name: Daily Shopee AI video

on:
  schedule:
    - cron: "0 2 * * *"   # 09:00 Asia/Bangkok, once per day
  workflow_dispatch:        # manual "Run workflow" button / dashboard

concurrency:
  group: shopee-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: System deps (ffmpeg + Thai shaping)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Write Google service account
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SA_JSON" > scraper/service-account.json

      - name: Generate + deliver one video
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gateway' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-2.5-flash-lite' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PROVIDER: elevenlabs
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: scraper/service-account.json
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          # Renderer: local = product photo + FFmpeg ($0). fal = Flux/Kling (~$1.40, needs fal credits)
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER || 'local' }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # review = Telegram only (safe default). auto = also post to connected socials.
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'review' }}
          COST_CAP_USD: "2.00"
        run: python -m pipeline.run --source sheets

      - name: Upload artifact (MP4 + spend log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-video
          path: |
            output/*.mp4
            output/spend_log.json
          retention-days: 7
          if-no-files-found: ignore
