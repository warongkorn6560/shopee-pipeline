name: Daily Shopee AI video

on:
  schedule:
    - cron: "7 * * * *"   # hourly; the gate job runs only at the hours in SHOP_POST_HOURS (Bangkok)
  workflow_dispatch:        # manual "Run workflow" button / dashboard

concurrency:
  group: shopee-video
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          HOURS: ${{ vars.SHOP_POST_HOURS || '9' }}
          EVENT: ${{ github.event_name }}
        run: |
          now=$(TZ=Asia/Bangkok date +%-H)
          run=false
          [ "$EVENT" != "schedule" ] && run=true
          for h in ${HOURS//,/ }; do [ "$h" = "$now" ] && run=true; done
          echo "Bangkok hour $now · post hours $HOURS · run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  make-video:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-media

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: |
          pip install -r requirements.txt
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow has no raqm: Thai text would render wrong'; print('raqm ok')"

      - name: Generate + deliver one video
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gateway' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-2.5-flash-lite' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'high' }}
          TTS_MODEL: ${{ vars.TTS_MODEL || 'eleven_v4' }}
          SHOP_VOICE_ID: ${{ vars.SHOP_VOICE_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PROVIDER: elevenlabs
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://pipeline-dashboard-seven-kappa.vercel.app' }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          # review = dashboard review page + Telegram (safe default). auto = also post to connected socials.
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'review' }}
          COST_CAP_USD: "2.00"
        run: python -m pipeline.run

      - name: Upload artifact (MP4 + spend log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-video
          path: |
            output/*.mp4
            output/spend_log.json
          retention-days: 7
          if-no-files-found: ignore
