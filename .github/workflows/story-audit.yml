name: Audit story clips

# Looks through posted clips for bad pictures (drawings, dead/stuffed animals, wrong species).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel id"
        required: true
      days:
        description: "How many days back"
        required: false
        default: "3"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get install -y ffmpeg > /dev/null
      - name: Audit
        env:
          PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://pipeline-dashboard-seven-kappa.vercel.app' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.story.audit "${{ inputs.channel }}" "${{ inputs.days }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit
          path: output/audit/
