name: YouTube backfill

# Daily: upload posted story videos that never reached YouTube (quota allows ~6 uploads/day;
# 3 here leaves room for the day's new clips).
on:
  schedule:
    - cron: "15 20 * * *"   # 03:15 Asia/Bangkok
  workflow_dispatch:
    inputs:
      max:
        description: "How many to upload"
        required: false
        default: "3"

concurrency:
  group: youtube-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upload
        env:
          PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://pipeline-dashboard-seven-kappa.vercel.app' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m pipeline.youtube_backfill "${{ inputs.max || '3' }}"
