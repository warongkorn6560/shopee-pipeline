name: Backfill posts

# Posts already-published story videos to platforms they missed, a few at a time:
#  - YouTube: once a day at 03:15, until the channel's daily upload limit says stop
#  - Instagram: each run posts up to 4, 30 minutes apart (bursts trip Instagram's "too many
#    actions" throttle). GitHub often skips scheduled runs, so each run does several.
#  - TikTok: once a day at 04:45, up to 5, 30 minutes apart, until TikTok's limit says stop
on:
  schedule:
    - cron: "15 20 * * *"     # 03:15 Asia/Bangkok — YouTube
    - cron: "40 */2 * * *"    # every 2 hours — Instagram
    - cron: "45 21 * * *"     # 04:45 Asia/Bangkok — TikTok
  workflow_dispatch:
    inputs:
      platform:
        description: "youtube, instagram or tiktok"
        required: false
        default: "youtube"
      max:
        description: "How many to post"
        required: false
        default: "3"
      gap:
        description: "Minutes between posts"
        required: false
        default: "30"

concurrency:
  group: backfill-posts
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upload
        env:
          PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://pipeline-dashboard-seven-kappa.vercel.app' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "15 20 * * *") platform=youtube; max=8; gap=2 ;;
              "45 21 * * *") platform=tiktok; max=5; gap=30 ;;
              *) platform=instagram; max=4; gap=30 ;;
            esac
          else
            platform="${{ inputs.platform || 'youtube' }}"; max="${{ inputs.max || '3' }}"; gap="${{ inputs.gap || '30' }}"
          fi
          python -m pipeline.youtube_backfill "$max" "$platform" "$gap"
