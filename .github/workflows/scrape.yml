name: Daily Shopee scrape
on:
  schedule:
    - cron: "30 1 * * *"   # 08:30 Asia/Bangkok, before the 09:00 video run
  workflow_dispatch:

concurrency:
  group: shopee-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Write service account JSON
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SA_JSON" > scraper/service-account.json
      - name: Run scraper (new products land in the Inbox as Status=New)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: scraper/service-account.json
        run: python scraper/scrape_shopee.py --top 3 --sink sheets
