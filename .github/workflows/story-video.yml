name: Daily story video

on:
  schedule:
    - cron: "7 * * * *"   # hourly; each channel runs at its own posting hours (Bangkok), default STORY_POST_HOURS
  workflow_dispatch:
    inputs:
      topic:
        description: "One-off topic (leave empty to use the Stories queue on the dashboard)"
        required: false
        default: ""
      seconds:
        description: "Target length in seconds for this run (empty = STORY_TARGET_SECONDS)"
        required: false
        default: ""
      preview:
        description: "Preview only: send to Telegram + review page, never post (overrides the page's mode)"
        type: boolean
        required: false
        default: false
      style:
        description: "Editing style for this run: classic or reaction (empty = STORY_STYLE_MIX)"
        required: false
        default: ""
      count:
        description: "Burst: how many videos to make back to back (one after another, each posted when done)"
        required: false
        default: "1"
      channel:
        description: "Channel id from the dashboard (fb-<pageId>); empty = every enabled channel, or the primary one when a topic is given"
        required: false
        default: ""

concurrency:
  # previews run beside a burst instead of queueing behind it
  group: story-video-${{ inputs.preview && 'preview' || 'main' }}
  cancel-in-progress: false

jobs:
  # One video per connected Facebook Page ("channel" in the dashboard), each with its own theme.
  # With no channels yet, a single job runs on the GitHub variables as before.
  channels:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      run: ${{ steps.list.outputs.run }}
    steps:
      - id: list
        env:
          PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://pipeline-dashboard-seven-kappa.vercel.app' }}
          ONLY: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          EVENT: ${{ github.event_name }}
          COUNT: ${{ inputs.count || '1' }}
          DEFAULT_HOURS: ${{ vars.STORY_POST_HOURS || '19' }}
        run: |
          res=$(curl -sf -H "Authorization: Bearer $PIPELINE_API_KEY" "$DASHBOARD_URL/api/pipeline/channels" || echo '{}')
          hour=$(TZ=Asia/Bangkok date +%-H)
          matrix=$(jq -c --arg only "$ONLY" --arg topic "$TOPIC" --arg event "$EVENT" --argjson hour "$hour" \
                      --arg dflt "$DEFAULT_HOURS" '
            (.primaryId // "") as $p
            | ($dflt | split(",") | map(select(. != "") | tonumber)) as $default
            # GitHub often runs the hourly cron late or skips hours, so a slot stays due for 6 hours;
            # the run itself skips when the channel already has a clip since that slot (story/run.py).
            | def hours: (if ((.postHours // []) | length) > 0 then .postHours else $default end);
            def due: $event != "schedule" or (hours | any(.[]; (($hour - . + 24) % 24) < 6));
            [(.channels // [])[] | select(.enabled) | select(due)
               | {id, theme: (.theme // ""), series: (.seriesName // ""), niche: (.niche // ""),
                  mode: (.publishMode // ""), primary: (if .id == $p then "true" else "false" end),
                  hours: (hours | map(tostring) | join(","))}]
            | if $only != "" then map(select(.id == $only))
              elif $topic != "" then map(select(.primary == "true"))
              else . end
            | if length == 0 and ((($res_channels | length) == 0) and ({} | due)) then [{id: "", theme: "", series: "", niche: "", mode: "", primary: "true", hours: $dflt}] else . end
            | [range(0; ($count | tonumber) | if . < 1 then 1 elif . > 60 then 60 else . end) as $k | .[] | . + {n: ($k + 1 | tostring)}]
            | {include: .}' --arg count "$COUNT" --argjson res_channels "$(jq -c '[(.channels // [])[] | select(.enabled)]' <<<"$res")" <<<"$res")
          run=$(jq -r 'if (.include | length) > 0 then "true" else "false" end' <<<"$matrix")
          echo "Bangkok hour $hour · run=$run · $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  make-story:
    needs: channels
    if: needs.channels.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time, so auto-topics never collide and posts come out spaced
      matrix: ${{ fromJSON(needs.channels.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40   # map rendering takes ~5 min; leaves room for slow tile servers
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-media

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: |
          pip install -r requirements.txt
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow has no raqm: Thai text would render wrong'; print('raqm ok')"

      - name: Generate + deliver one story
        env:
          TOPIC: ${{ inputs.topic }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gateway' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-2.5-flash-lite' }}
          STORY_LLM_MODEL: ${{ vars.STORY_LLM_MODEL || 'openai/gpt-4.1-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'high' }}
          TTS_MODEL: ${{ vars.TTS_MODEL || 'eleven_v4' }}
          STORY_TARGET_SECONDS: ${{ inputs.seconds || vars.STORY_TARGET_SECONDS || '75' }}
          STORY_THEME: ${{ matrix.theme || vars.STORY_THEME || 'wildlife' }}
          STORY_STYLE_MIX: ${{ vars.STORY_STYLE_MIX || 'classic:80,reaction:20' }}
          STORY_STYLE: ${{ inputs.style }}
          STORY_MUSIC: ${{ vars.STORY_MUSIC }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PROVIDER: elevenlabs
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://pipeline-dashboard-seven-kappa.vercel.app' }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # review = dashboard review page + Telegram (safe default). auto = also post to Facebook/TikTok/IG.
          PUBLISH_MODE: ${{ inputs.preview && 'review' || matrix.mode || vars.STORY_PUBLISH_MODE || 'review' }}
          STORY_CHANNEL_ID: ${{ matrix.id }}
          STORY_SLOT_HOURS: ${{ matrix.hours }}
          STORY_CHANNEL_PRIMARY: ${{ matrix.primary }}
          # the global series/niche belong to the global theme; a channel on another theme uses its own or the theme default
          STORY_SERIES_NAME: ${{ matrix.series || ((matrix.theme == '' || matrix.theme == vars.STORY_THEME) && vars.STORY_SERIES_NAME || '') }}
          STORY_NICHE: ${{ matrix.niche || ((matrix.theme == '' || matrix.theme == vars.STORY_THEME) && vars.STORY_NICHE || '') }}
          STORY_IMAGE_PROVIDER: ${{ vars.STORY_IMAGE_PROVIDER || 'wikimedia' }}   # real archival photos only, never AI images of real people
          STORY_AUTO_TOPIC: ${{ vars.STORY_AUTO_TOPIC || 'on' }}
          STORY_VOICE_ID: ${{ vars.STORY_VOICE_ID }}
          COST_CAP_USD: "0.50"
        run: |
          if [ -n "$TOPIC" ]; then
            python -m pipeline.story --topic "$TOPIC"
          else
            python -m pipeline.story
          fi

      - name: Upload artifact (MP4 + plan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-video${{ matrix.id && format('-{0}', matrix.id) || '' }}-${{ matrix.n }}
          path: |
            output/story_*.mp4
            output/story_latest.json
            output/spend_log.json
          retention-days: 7
          if-no-files-found: ignore
